<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    var th = s.theme, light = th === 'light' || ((!th || th === 'system') && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.style.setProperty('--splash-bg', light ? '#f3f1ee' : '#0b0a09');
    if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) document.documentElement.classList.add('ios');
  } catch (e) {}
</script>
<title>myGym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#0b0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="myGym">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
  /* Shown from the first byte, so a cold start is the icon on the app's own black and not a blank
     page; main.jsx fades it out once the app has drawn. */
  #splash{position:fixed;inset:0;z-index:9999;background:var(--splash-bg,#0b0a09);display:flex;align-items:center;justify-content:center;transition:opacity .42s ease}
  #splash.out{opacity:0;pointer-events:none}
  /* the mark is inline so it is there on the very first paint, not after a fetch; it holds still, then
     swells a little as the splash lets go, like an app opening out of its icon */
  #splash svg{width:112px;height:112px;transition:transform .5s cubic-bezier(.32,.72,0,1)}
  #splash.out svg{transform:scale(1.22)}
  @media (prefers-reduced-motion:reduce){#splash,#splash svg{transition:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g fill="#ff6a3d"><rect x="75" y="235" width="362" height="42" rx="21"/><rect x="117" y="139" width="53" height="234" rx="20"/><rect x="342" y="139" width="53" height="234" rx="20"/><rect x="181" y="181" width="43" height="150" rx="16" opacity=".62"/><rect x="288" y="181" width="43" height="150" rx="16" opacity=".62"/></g></svg></div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
