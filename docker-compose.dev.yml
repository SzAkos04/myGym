# The fast loop for working on the frontend: no image build at all.
#
#   cd frontend && npm run build          # about 10 seconds, nothing to wait for from Docker
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d web      # once; after that
#                                         # every new `npm run build` is live on the next page load
#
# nginx serves the build straight from ./frontend/dist and the exercise media from
# ./catalogue/media, instead of the copies baked into the image. The API container is untouched.
# For a real deploy (or to go back), `docker compose up -d --build` as before.
services:
  web:
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./catalogue/media:/usr/share/nginx/html/exercise-media:ro
