# myGym only (Compose reads this file next to docker-compose.yml by itself; upstream has none, so
# syncing never conflicts over it). The web image is built with the commit it came from, and the
# app shows it as "v1.4.1+<commit>" in Settings, so "which version is the server running?" has an
# answer on the phone. scripts/server-update.sh sets APP_BUILD; unset, the plain version shows.
services:
  web:
    build:
      args:
        APP_BUILD: ${APP_BUILD:-}
  # myGym's sync gateway (api/fork/sync-gateway.js, docs/dev/SYNC_SPEED.md): upstream's API runs inside it
  # on port 3100, unmodified, and the gateway listens on 3000 in front of it, taking gzipped pushes and
  # pushes of only what changed. The API image copies its files one by one (upstream's Dockerfile), so
  # the fork's files come in from this checkout, read-only. Delete these lines and redeploy to run
  # upstream's API exactly as it ships.
  api:
    command: ["node", "fork/sync-gateway.js"]
    environment:
      - UPSTREAM_PORT=3100
    volumes:
      - ./api/fork:/app/fork:ro
